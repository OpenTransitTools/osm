name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  all-tests:
    name: Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install "poetry==2.3.2"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Verify package import
        run: poetry run python -c "import ott; import ott.osm"

      - name: Ensure pytest is available
        run: poetry run python -m pip install --upgrade pytest

      - name: Run unittest suite (ott.osm.tests.test)
        run: poetry run python -m unittest -v ott.osm.tests.test

      - name: Run osm_abbr_tester.py
        run: poetry run python -m ott.osm.tests.osm_abbr_tester

      - name: Run docker pytest suite
        run: poetry run pytest -v ott/osm/tests/docker/test_project_scripts_docker.py
