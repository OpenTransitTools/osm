name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests (containerized run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image from repo Dockerfile
        run: docker/buildDocker.sh

      - name: Run non-docker tests in container
        run: docker run --rm open-transit-tools/osm:python3.14 python -m unittest -v ott.osm.tests.test

  docker-tests:
    name: Docker API Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for pytest runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build image from repo Dockerfile
        run: docker/buildDocker.sh

      - name: Container smoke check
        run: docker run --rm open-transit-tools/osm:python3.14 osm_stats_cfg || true

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run docker-backed API tests
        run: python -m pytest -v ott/osm/tests/docker/test_project_scripts_docker.py
