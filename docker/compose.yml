services:
  osm:
    image: OpenTransitTools/osm:python3.14
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /osm
    stdin_open: true
    tty: true
    command: bash
    volumes:
      # Primary runtime config consumed by commands like osm_update/osm_stats_cfg.
      - ../config/app.ini:/osm/config/app.ini:ro

      # Persist internal cache generated by pipeline commands.
      - ../ott/osm/cache:/osm/ott/osm/cache

      # User-managed input and output mounts for ad hoc commands.
      - ../data/input:/data/input
      - ../data/output:/data/output

      # Optional mount of full repo for direct file access from container commands.
      - ..:/workspace
